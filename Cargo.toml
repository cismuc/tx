[package]
name = "tx"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tx"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
portable-pty = "0.8"
vt100 = "0.15"
tui-term = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glob = "0.3"
anyhow = "1.0"
futures = "0.3"
